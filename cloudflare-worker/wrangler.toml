name = "nano-money"
main = "src/worker.js"
compatibility_date = "2024-03-20"

# Environment variables.
# FIREBASE_PROJECT_ID diisi di sini karena bukan rahasia.
# GEMINI_API_KEY JANGAN ditulis di file ini, tapi diset lewat:
#   wrangler secret put GEMINI_API_KEY
# atau lewat Dashboard > Settings > Variables and Secrets.
[vars]
FIREBASE_PROJECT_ID = "nano-money-a44b0"
# Opsional. Default 100 kalau baris ini dikomentari/dihapus.
# RATE_LIMIT_PER_DAY = "100"

# --- Rate limit harian (Cloudflare KV) ---
# Worker memakai binding KV bernama RATE_LIMIT untuk kuota harian per uid.
# Binding ini TIDAK otomatis ada; pemilik akun Cloudflare harus membuatnya dulu:
#   wrangler kv namespace create RATE_LIMIT
# lalu salin nilai `id = "..."` yang dicetak ke blok di bawah, hapus tanda
# komentar, dan deploy ulang.
# Selama blok ini belum aktif, Worker tetap berjalan TANPA rate limit (fail-open)
# supaya deployment lama tidak mati; hanya ada satu console.warn per isolate.
# Isi <KV_NAMESPACE_ID> dengan id asli dari perintah di atas — jangan dikira-kira.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<KV_NAMESPACE_ID>"
