name = "nano-money"
main = "src/worker.js"
compatibility_date = "2024-03-20"

# Environment variables.
# FIREBASE_PROJECT_ID diisi di sini karena bukan rahasia.
# GEMINI_API_KEY JANGAN ditulis di file ini, tapi diset lewat:
#   wrangler secret put GEMINI_API_KEY
# atau lewat Dashboard > Settings > Variables and Secrets.
[vars]
FIREBASE_PROJECT_ID = "nano-money-a44b0"
# Opsional. Default 100 kalau baris ini dikomentari/dihapus.
# RATE_LIMIT_PER_DAY = "100"

# --- Rate limit harian (Cloudflare KV) ---
# Worker memakai binding KV bernama RATE_LIMIT untuk kuota harian per uid.
# Blok di bawah sudah aktif; kuota default 100 request/uid/hari (UTC).
# Kalau binding ini dihapus, Worker tetap jalan TANPA rate limit (fail-open)
# supaya deployment lama tidak mati; hanya ada satu console.warn per isolate.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e6ccf967168b4aabbcc0beef28b8bfb5"

# --- Penempatan Worker (WAJIB agar Gemini tidak menolak) ---
# Google menilai lokasi dari IP KELUAR Worker, bukan lokasi HP user. Tanpa blok
# ini Cloudflare menjalankan Worker di colo terdekat pengunjung -- untuk
# pengunjung Indonesia sering Hong Kong (HKG) -- dan Gemini membalas:
#   HTTP 400 FAILED_PRECONDITION
#   "User location is not supported for the API use."
# Placement Hints memaksa Worker berjalan di colo terdekat GCP us-central1
# (Amerika Serikat) yang diizinkan Gemini. Format nilainya {provider}:{region}.
# Kalau perlu diganti, pakai region lain yang didukung Gemini, mis. gcp:us-east4.
[placement]
region = "gcp:us-central1"
